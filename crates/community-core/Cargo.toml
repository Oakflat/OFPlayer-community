[package]
name = "ofplayer-community-core"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Standalone local music and catalog core for OFPlayer Community"

[features]
default = []
asio-output = ["cpal/asio"]

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.16.0"
dsd-reader = "0.3.1"
fs2 = "0.4"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
lofty = "0.24.0"
notify = "8.2.0"
quick-xml = "0.38.4"
rodio = { version = "0.21.1", features = ["symphonia-all"] }
rusqlite = { version = "0.37.0", features = ["bundled", "backup"] }
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.61.3", features = ["Media", "Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
