<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OFPlayer — Hand-drawn music icons</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf9fc; color: #625d69; font: 14px system-ui, sans-serif; }
    main { max-width: 1200px; margin: auto; padding: 32px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px; }
    p { margin: 0; opacity: .8; }
    button { font: inherit; padding: 10px 16px; border: 1px solid #b6afc2; border-radius: 10px; color: inherit; background: transparent; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: #e8e4ef; border: 1px solid #e8e4ef; border-radius: 16px; overflow: hidden; }
    article { background: #fff; padding: 24px 12px 18px; display: flex; align-items: center; flex-direction: column; gap: 14px; }
    .sizes { display: flex; align-items: center; gap: 20px; height: 24px; }
    .active { color: #ed7d47; }
    h2 { font-size: 12px; font-weight: 500; margin: 0; }
    a { color: inherit; text-decoration: none; }
    .dark { color: #dfdbe6; background: #13121a; }
    .dark article { background: #1d1b26; }
    .dark .grid { background: #363240; border-color: #363240; }
    @media (max-width: 800px) { .grid { grid-template-columns: repeat(3,minmax(0,1fr)); } }
  </style>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { createApp, h, ref } from 'vue'
  import { MusicIcon } from '../src/components/icons/MusicIcon.ts'
  import { musicIconPaths } from '../src/components/icons/musicIconPaths.ts'
  createApp({ setup() {
    const dark = ref(false)
    return () => h('main', { class: { dark: dark.value } }, [
      h('header', [h('div', [h('h1', 'OFPlayer / Music icons'), h('p', 'User contours · 24-unit grid · currentColor · 64 / 16 / 20 / 24 px')]), h('button', { onClick: () => dark.value = !dark.value }, dark.value ? 'Light background' : 'Dark background')]),
      h('div', { class: 'grid' }, Object.keys(musicIconPaths).map(name => h('article', [
        h(MusicIcon, { name, width: 64, height: 64 }),
        h('div', { class: 'sizes' }, [16, 20, 24].map(size => h(MusicIcon, { name, width: size, height: size, class: size === 24 ? 'active' : '' }))),
        h('h2', [h('a', { href: `../src/assets/music-icons/${name}.svg`, download: `${name}.svg` }, name)]),
      ]))),
    ])
  }}).mount('#app')
</script>
</body>
</html>
